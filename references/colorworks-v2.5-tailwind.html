<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COLORWORKS MASTERS STUDIO - Ink Bleed Journey</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              900: '#4c1d95',
            },
            darkBg: '#09090d',
            panelBg: '#12121c',
            cardBg: '#1a1a2a',
            borderColor: '#2a2a42'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Cinzel', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkBg text-gray-200 font-sans h-screen flex flex-col overflow-hidden select-none">
  <header class="h-16 border-b border-borderColor bg-panelBg/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-700 via-brand-500 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
        <i class="fa-solid font-bold text-white text-lg fa-pen-nib"></i>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg text-transparent bg-clip-text bg-gradient-to-r from-purple-200 via-violet-300 to-indigo-100 tracking-wider">COLORWORKS MASTERS STUDIO</h1>
        <p class="text-xs text-gray-400">Pro Ink-Bleed Art Journey Generator · Motion & Fidelity Engine v2.5</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden relative">
    <aside class="w-80 border-r border-borderColor bg-panelBg flex flex-col shrink-0 z-10">
      <div class="p-4 border-b border-borderColor">
        <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-1 flex items-center justify-between">
          <span>Masterpiece Gallery</span>
          <span class="text-[10px] bg-brand-900/60 text-brand-300 px-2 py-0.5 rounded-full border border-brand-500/30 font-mono">10 PIECES</span>
        </h2>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-2" id="pieceList"></div>
    </aside>

    <div class="flex-1 flex flex-col items-center justify-center bg-darkBg relative overflow-hidden p-6">
      <div id="stageContainer" class="relative rounded-2xl overflow-hidden shadow-2xl border border-borderColor">
        <div id="stage"></div>
      </div>
    </div>
  </main>

  <script>
    let strokes = [], animFn = () => {};
    const STAGE_W = 900, STAGE_H = 900;
    let curPieceKey = 'blooming_skull';
    let playing = false, playT = 0, dur = 4.5, bleedScale = 1.4;

    function setup() {
      const cnv = createCanvas(STAGE_W, STAGE_H);
      cnv.parent('stage');
    }

    function draw() {
      background(250, 250, 252);
    }
  </script>
</body>
</html>
